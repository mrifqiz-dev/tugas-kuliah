<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Interaktif</title>
    <style>
    </style>
</head>
<body>
    <h1>Formulir Interaktif - P5_069</h1>
    <form id="myForm">
        <label for="userInput">Masukkan nama:</label>
        <input type="text" id="userInput" placeholder="Masukkan nama anda">
        <button type="submit">Kirim</button>
    </form>
    <p id="message"></p>
</body>
<script>

    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('myForm');
        const message = document.getElementById('message');
 
        form.addEventListener('submit', (event) => {
            event.preventDefault();
           const userInput = document.getElementById('userInput').value;
           if (userInput.trim()) {
                message.textContent = `Terima kasih, ${userInput}! Formulir telah dikirim.`;
           } else {
                message.textContent = 'Silakan masukkan nama Anda.';
           }
        });
    });
</script>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konverter Suhu</title>
</head>

<body>
    <h1>Konverter Suhu - T1_069</h1>
    <form id="formKonversi">
        <label for="suhu">Masukkan Suhu:</label>
        <input type="number" id="suhu" placeholder="Contoh: 25" required>
        
        <label for="dari">Dari:</label>
        <select id="dari" required>
            <option value="Celsius">Celsius</option>
            <option value="Fahrenheit">Fahrenheit</option>
            <option value="Reamur">Reamur</option>
        </select>
        
        <label for="ke">Ke:</label>
        <select id="ke" required>
            <option value="Celsius">Celsius</option>
            <option value="Fahrenheit">Fahrenheit</option>
            <option value="Reamur">Reamur</option>
        </select>
        
        <button type="submit">Konversi</button>
    </form>
    <div id="hasil"></div>
    
<script src="T1_069.js"></script>   
</body>
</html>
